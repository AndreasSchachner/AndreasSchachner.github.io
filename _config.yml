# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Andreas Schachner
email: as3475@cornell.edu
description: >- # this means to ignore newlines until "baseurl:"
  Postdoctoral researcher in theoretical physics at Cornell University and the Arnold
  Sommerfeld Center, LMU Munich. String phenomenology, flux vacua, moduli stabilisation,
  de Sitter constructions, higher-derivative corrections, the axiverse, and JAX-native
  machine-learning tools for high-energy theory.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://andreasschachner.github.io"
twitter_username: "Andi1707"
github_username:  "AndreasSchachner"

# SEO tag metadata (consumed by jekyll-seo-tag → OpenGraph + Twitter cards).
# `author` is a string so minima's footer renders it cleanly as
# "{{ site.author }}"; jekyll-seo-tag also accepts the string form
# and uses `email` (top-level) for contact info.
author: Andreas Schachner
image:  /images/profile01.JPG
social:
  name: Andreas Schachner
  links:
    - https://github.com/AndreasSchachner
    - https://github.com/ASchachnerGroup
    - https://inspirehep.net/authors/1635387
    - https://orcid.org/0000-0002-7287-1476
    - https://www.classe.cornell.edu/about/people/andreas-schachner
    - https://www.linkedin.com/in/andreas-schachner-4804051a5/

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
markdown: kramdown
kramdown:
  math_engine: mathjax

# Defaults
defaults:
  # _posts
  -
    scope:
      path: ""
      type: posts
    values:
      mathjax: true
  

