{%- comment -%}
Override of minima 2.5's _includes/head.html.
Adds favicons, Apple touch icon, and the Inter webfont; keeps the
rest of the default head (SEO tag, main stylesheet, feed metadata,
optional Google Analytics include).
{%- endcomment -%}
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- seo -%}

  <link rel="icon" type="image/png" sizes="32x32"
        href="{{ '/images/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16"
        href="{{ '/images/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180"
        href="{{ '/images/apple-touch-icon.png' | relative_url }}">

  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}

  <script data-goatcounter="https://andreasschachner.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var footer = document.querySelector('.site-footer .wrapper');
    if (!footer) return;
    var p = document.createElement('p');
    p.style.cssText = 'color:#8b949e;font-size:0.85rem;margin-top:0.5rem;';
    var span = document.createElement('span');
    span.className = 'gc-count';
    p.appendChild(span);
    footer.appendChild(p);
    (function poll() {
      if (window.goatcounter && goatcounter.visit_count) {
        try {
          goatcounter.visit_count({
            append: '.gc-count', type: 'html', no_branding: true, style: '',
            no_error: true
          });
        } catch (e) { p.style.display = 'none'; }
        // Hide if the API returned an error string instead of a count.
        setTimeout(function () {
          if (span.textContent.toLowerCase().indexOf('error') !== -1 ||
              span.textContent.trim() === '') {
            p.style.display = 'none';
          }
        }, 2000);
      } else {
        setTimeout(poll, 200);
      }
    })();
  });
  </script>
</head>
