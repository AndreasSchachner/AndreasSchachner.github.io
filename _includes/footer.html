{%- comment -%}
Override of minima 2.5 footer. Compact academic footer with social
row, copyright, last-updated timestamp, and GoatCounter page-view
counter.
{%- endcomment -%}
<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>
  <div class="wrapper">
    <p class="site-footer__meta">
      &copy; {{ site.time | date: '%Y' }} {{ site.title | escape }}
      &middot; Last updated {{ site.time | date: '%B %Y' }}
      &middot; <span class="gc-count"></span>
    </p>
  </div>
</footer>

<script>
(function checkGC() {
  if (window.goatcounter && goatcounter.visit_count) {
    goatcounter.visit_count({
      append: '.gc-count',
      type:   'html',
      no_branding: true,
      style:  ''
    });
  } else {
    setTimeout(checkGC, 200);
  }
})();
</script>

<style>
.site-footer__meta {
  color: #8b949e;
  font-size: 0.85rem;
  margin: 0.25rem 0 0;
}
.gc-count { color: #8b949e; font-size: 0.85rem; }
</style>
